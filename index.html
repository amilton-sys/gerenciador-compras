<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerenciador</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    <script type="module" src="app.js" defer></script>
  </head>

  <body>
    <main class="container-fluid">
      <div class="row p-3">
        <div class="col-12 col-md-6 col-lg-4 offset-md-3 offset-lg-4">
          <div class="text-center">
            <label for="valorTotal" class="form-label fs-3">Total</label>
            <h1 id="valorTotal">R$ 0,00</h1>
          </div>
          <div class="mb-3">
            <label for="nome" class="form-label fs-3">Digite o nome</label>
            <input type="text" id="nome" class="form-control fs-3" />
          </div>
          <div class="mb-3">
            <label for="quantidade" class="form-label fs-3">Digite quantidade</label>
            <input type="number" id="quantidade" class="form-control fs-3" />
          </div>
          <div class="mb-3">
            <label for="valorUnitario" class="form-label fs-3"
              >Digite valor unitário</label
            >
            <input type="number" id="valorUnitario" class="form-control fs-3" />
          </div>
          <div class="d-flex gap-2 justify-content-between">
            <button type="button" class="btn btn-primary fs-5" id="cadastrar">Cadastrar</button>
            <button type="button" class="btn btn-secondary fs-5" id="deleteTodos">Deleta Todos</button>
            <button type="button" class="btn btn-danger fs-5" id="limpar">Limpar</button>
          </div>
          <ul class="list-unstyled mt-3 d-flex flex-column gap-2">
            <!-- Produtos serão adicionados aqui -->
          </ul>
        </div>
      </div>
    </main>
  </body>
</html>
